server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA de React Router: cualquier ruta que no sea un archivo real (ej. /ventas,
    # /clientes) cae en index.html y el router del navegador se encarga del resto.
    # Sin esto, F5 en una ruta que no sea "/" da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que el front pide a /api/... se reenvía al contenedor del backend
    # ("backend" es el nombre del servicio en docker-compose.yml, resuelto por la
    # red interna de Docker). El navegador nunca ve otro origen: no hace falta CORS.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
